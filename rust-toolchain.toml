# The Rust that builds, lints and releases this fork: the channel cctop is
# pinned to (flolep2607/cctop's rust-toolchain.toml), so the crates are checked
# here with the compiler and lints they are built with there. Move it together
# with cctop's.
#
# Upstream pinned an exact older release to reproduce the rmux-web-crypto WASM
# blob byte for byte. This fork does not build that blob: cctop serves a pinned
# copy of the browser app, WASM included.
[toolchain]
channel = "1.99"
components = ["clippy", "rustfmt"]
profile = "minimal"

# The cargo-semver-checks that CI's release-plan job runs on a release commit.
# It reads the rustdoc JSON this toolchain writes, so it is pinned beside the
# channel, and a change that moves `channel` may have to move this line too.
# CI installs the version on this line and tools/release-plan.sh refuses any
# other; the line is read by both, so keep its shape.
#
# cargo-semver-checks 0.51.0
