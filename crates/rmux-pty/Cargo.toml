[package]
name = "cctop-rmux-pty"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "cctop's fork of rmux-pty. PTY allocation, resize, and child-process control for the RMUX terminal multiplexer."
keywords = ["terminal", "multiplexer", "pty"]
categories = ["command-line-interface", "os"]

# Published under cctop's name, built under upstream's: dependents and
# merges from Helvesec/rmux keep saying `rmux_pty`.
[lib]
name = "rmux_pty"

[dependencies]
rmux-types = { workspace = true }
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
libc = "0.2.185"
rmux-os = { workspace = true }
rustix = { version = "1.1.4", features = ["process", "termios", "pty", "fs"] }
