[package]
name = "cctop-rmux-ipc"
version = "0.10.0"
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "cctop's fork of rmux-ipc. Local IPC endpoint and transport primitives for the RMUX terminal multiplexer."
keywords = ["terminal", "multiplexer", "ipc"]
categories = ["asynchronous", "command-line-interface"]

# Published under cctop's name, built under upstream's: dependents and
# merges from Helvesec/rmux keep saying `rmux_ipc`.
[lib]
name = "rmux_ipc"

[dependencies]
rmux-os = { workspace = true }
tokio = { version = "1.48.0", features = ["io-util", "net", "rt", "sync", "time"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.185"
rustix = { version = "1.1.4", features = ["event", "net"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
