[package]
name = "cctop-rmux-proto"
version = "0.10.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "cctop's fork of rmux-proto. RMUX detached IPC protocol DTOs, framing, and wire-safe error types."
keywords = ["terminal", "multiplexer", "protocol"]
categories = ["command-line-interface", "asynchronous"]
publish = true

# Published under cctop's name, built under upstream's: dependents and
# merges from Helvesec/rmux keep saying `rmux_proto`.
[lib]
name = "rmux_proto"

[dependencies]
bincode = "1.3.3"
rmux-types = { workspace = true, features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

[features]
fuzzing = []
