[package]
name = "cctop-rmux-sdk"
version = "0.10.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "cctop's fork of rmux-sdk. Public, daemon-backed Rust SDK for the RMUX terminal multiplexer (facade, ensure-session, snapshots, events, detach helpers)."
keywords = ["terminal", "multiplexer", "sdk"]
categories = ["command-line-interface", "asynchronous"]
publish = true

# Published under cctop's name, built under upstream's: dependents and
# merges from Helvesec/rmux keep saying `rmux_sdk`.
[lib]
name = "rmux_sdk"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = [
    "events",
    "windows",
], optional = true }
rmux-ipc = { workspace = true }
rmux-os = { workspace = true }
rmux-proto = { workspace = true }
regex = { version = "1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs"] }
signal-hook = "0.3.18"
# Bootstrap actor needs Unix-specific async I/O plumbing (UnixStream + sleep),
# scoped to cfg(unix) so the SDK transport-actor manifest stays narrow on
# every other target.
tokio = { version = "1.48.0", features = ["net", "time"] }

[dev-dependencies]
bincode = "1.3.3"
crossterm = { version = "0.29.0", default-features = false, features = [
    "events",
    "windows",
] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[features]
default = ["web"]
crossterm = ["dep:crossterm"]
regex = ["dep:regex"]
web = []
