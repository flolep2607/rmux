[package]
name = "cctop-rmux-client"
version = "0.10.0"
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "cctop's fork of rmux-client. Blocking local client and attach-mode plumbing for the RMUX terminal multiplexer."
keywords = ["terminal", "multiplexer", "client"]
categories = ["command-line-interface"]

# Published under cctop's name, built under upstream's: dependents and
# merges from Helvesec/rmux keep saying `rmux_client`.
[lib]
name = "rmux_client"

[dependencies]
rmux-core = { workspace = true }
rmux-ipc = { workspace = true }
rmux-os = { workspace = true }
rmux-proto = { workspace = true }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.185"
rmux-sdk = { workspace = true }
rustix = { version = "1.1.4", features = ["event", "net", "process", "runtime", "termios", "thread"] }
signal-hook = "0.3.18"
tokio = { version = "1.48.0", features = ["net", "rt", "time"] }

[dev-dependencies]
rmux-pty = { workspace = true }
rmux-server = { workspace = true }
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "macros", "net", "time"] }
