[package]
name = "cctop-rmux-core"
version = "0.10.2"
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "cctop's fork of rmux-core. Core session, pane, layout, format, hook, and buffer model for the RMUX terminal multiplexer."
keywords = ["terminal", "multiplexer", "core"]
categories = ["command-line-interface"]

# Published under cctop's name, built under upstream's: dependents and
# merges from Helvesec/rmux keep saying `rmux_core`.
[lib]
name = "rmux_core"

[features]
# Test-only seams for dependent crates' tests. Off by default, so a published
# build never exposes them.
test-seams = []

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
compact_str = "0.8.1"
regex = "1.12.2"
rmux-proto = { workspace = true }
# Only for the handover DTOs (src/handover.rs). rmux-proto already brings
# serde into every build of this crate, so this adds no dependency.
serde = { version = "1", features = ["derive"] }
unicode-width = "0.1"
