[package]
name = "rmux-core"
version = "0.10.0"
edition.workspace = true
# Not published by this fork yet: it is the next stage of flolep2607/cctop#197.
publish = false
license.workspace = true
repository.workspace = true
description = "Core session, pane, layout, format, hook, and buffer model for the RMUX terminal multiplexer."
keywords = ["terminal", "multiplexer", "core"]
categories = ["command-line-interface"]

[features]
# Test-only seams for dependent crates' tests. Off by default, so a published
# build never exposes them.
test-seams = []

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
compact_str = "0.8.1"
regex = "1.12.2"
rmux-proto = { workspace = true }
unicode-width = "0.1"
