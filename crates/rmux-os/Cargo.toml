[package]
name = "cctop-rmux-os"
version = "0.10.0"
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "cctop's fork of rmux-os. Small OS abstraction layer used by RMUX IPC and terminal integrations."
keywords = ["terminal", "multiplexer", "os"]
categories = ["os", "command-line-interface"]

# Published under cctop's name, built under upstream's: dependents and
# merges from Helvesec/rmux keep saying `rmux_os`.
[lib]
name = "rmux_os"

[dependencies]
rmux-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.185"
rustix = { version = "1.1.4", features = ["process", "termios"] }

