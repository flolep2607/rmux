[workspace]
members = [
    ".",
    "crates/rmux-types",
    "crates/rmux-proto",
    "crates/rmux-core",
    "crates/rmux-os",
    "crates/rmux-ipc",
    "crates/rmux-pty",
    "crates/rmux-client",
    "crates/rmux-server",
    "crates/rmux-sdk",
    "crates/rmux-web-crypto",
]
resolver = "2"

# cctop's fork (flolep2607/cctop#197). The crates cctop builds on are
# published as `cctop-rmux-*`; only `[package] name` changes, and each keeps
# its upstream `[lib] name`, so code still says `use rmux_sdk::…` and merges
# from Helvesec/rmux stay small. The dependency keys keep the upstream names
# too, through `package =` below, which is the one place the rename is spelled.
#
# The release version: every release of the fork bumps it and is tagged
# `cctop-v<version>`. Each published crate has its own version, bumped only
# when it changed; tools/release-plan.sh holds the rules.
[workspace.metadata.cctop-release]
version = "0.10.0"

# Requirements between the published crates are carets on the compatible part
# of the version, so a patch release of one leaves the others building beside
# it (tools/release-plan.sh, rule 3).
[workspace.dependencies]
rmux-types = { package = "cctop-rmux-types", path = "crates/rmux-types", version = "0.10" }
rmux-proto = { package = "cctop-rmux-proto", path = "crates/rmux-proto", version = "0.10" }
rmux-os = { package = "cctop-rmux-os", path = "crates/rmux-os", version = "0.10" }
rmux-ipc = { package = "cctop-rmux-ipc", path = "crates/rmux-ipc", version = "0.10" }
rmux-sdk = { package = "cctop-rmux-sdk", path = "crates/rmux-sdk", version = "0.10" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"
strip = "symbols"

[profile.release.package.rmux-core]
opt-level = 3

[profile.release.package.cctop-rmux-ipc]
opt-level = "s"

[profile.release.package.cctop-rmux-os]
opt-level = "s"

[profile.release.package.cctop-rmux-proto]
opt-level = "s"

[profile.release.package.rmux-pty]
opt-level = "s"

[profile.release.package.rmux-server]
opt-level = 3

[profile.release.package.rmux]
opt-level = "s"
strip = "symbols"

[profile.release.package.cctop-rmux-types]
opt-level = "s"

[profile.release.package.rmux-web-crypto]
# `lto` is inherited from `[profile.release]`; Cargo does not allow it here.
codegen-units = 1
opt-level = 3
strip = false

[workspace.package]
version = "0.10.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/flolep2607/rmux"

[package]
name = "rmux"
version = "0.10.0"
edition.workspace = true
# Not published by this fork: cctop does not use the tmux-style CLI. It stays
# in the workspace as the daemon the SDK's integration tests drive.
publish = false
license.workspace = true
repository.workspace = true
description = "A local terminal multiplexer with a tmux-style CLI, daemon runtime, Rust SDK, and ratatui integration."
readme = "README.md"
keywords = ["terminal", "multiplexer", "cli", "tui"]
categories = ["command-line-interface"]
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/build.rs",
    "/resources/windows/rmux.exe.manifest",
    "/resources/claude/skills/rmux/SKILL.md",
    "/docs/man/rmux.1",
    "/src/**",
    "/tests/**",
    "!/tests/xterm-oracle/node_modules/**",
]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
clap = { version = "=4.5.39", features = ["derive"] }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "=0.29.0", default-features = false }
rmux-client = { path = "crates/rmux-client", version = "0.10.0" }
rmux-core = { path = "crates/rmux-core", version = "0.10.0" }
rmux-os = { workspace = true }
rmux-proto = { workspace = true }
# The root binary owns the hidden internal daemon mode, so it links the server
# and Tokio runtime directly for that top-level re-exec path.
rmux-server = { path = "crates/rmux-server", version = "0.10.0", default-features = false }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["net", "rt", "rt-multi-thread", "time"] }

[features]
default = ["web"]
perf-instrument = ["rmux-server/perf-instrument"]
tiny-cli = []
web = ["rmux-server/web"]

[dev-dependencies]
libc = "0.2"
rmux-core = { path = "crates/rmux-core", version = "0.10.0" }
rmux-pty = { path = "crates/rmux-pty", version = "0.10.0" }
rmux-proto = { workspace = true }
rmux-sdk = { workspace = true }
rustix = { version = "1.1.4", features = ["event", "termios"] }

[build-dependencies]
embed-manifest = "=1.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes"] }

[[bin]]
name = "rmux"
path = "src/main.rs"

[[bin]]
name = "rmux-daemon"
path = "src/daemon_main.rs"
