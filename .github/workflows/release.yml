name: Release

# Moving the release version on main (`[workspace.metadata.cctop-release]
# version` in the root Cargo.toml) cuts a release: CI runs in full, every
# published crate whose version crates.io does not have yet is published, in
# dependency order, and the commit is tagged `cctop-v<version>`.
#
# Publishing comes before the tag. A run that fails part-way — a missing
# token, a 429 — leaves no tag, so running this workflow again from main
# carries on: the crates already up are skipped by reading the index, not by
# reading cargo's "already exists".
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      # "false" when main carries a release version that is tagged already:
      # any edit to the root Cargo.toml lands here, not only a bump, and such
      # a run ends green with the rest skipped.
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - id: version
        run: |
          tag="cctop-v$(tools/release-plan.sh version)"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            if git merge-base --is-ancestor "refs/tags/$tag" HEAD; then
              echo "::notice::not a release: $tag exists and is part of this commit's history"
              echo "release=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$tag exists on a commit outside main's history; move the release version before releasing"
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "release=true" >>"$GITHUB_OUTPUT"

  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: [plan, verify]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the CARGO_REGISTRY_TOKEN secret is not set on this repository"
            exit 1
          fi
          # `verify / package` built these exact packages from their packaged
          # source, so cargo's own verification build is skipped here.
          #
          # An assignment rather than `mapfile < <(...)`, whose exit status
          # bash drops: an index the script could not read must stop here,
          # not read as "nothing left to publish".
          list=$(tools/release-plan.sh unpublished)
          if [ -z "$list" ]; then
            echo "::notice::every crate is on crates.io at its version already; nothing to publish"
            exit 0
          fi
          mapfile -t crates <<<"$list"
          echo "publishing: ${crates[*]}"
          cargo publish --locked --no-verify "${crates[@]/#/-p=}"
      - name: Tag the release
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "refs/tags/$TAG"
