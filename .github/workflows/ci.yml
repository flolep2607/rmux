name: CI

# This fork exists to publish the rmux crates cctop builds on, as
# `cctop-rmux-*` (flolep2607/cctop#197). Upstream's CI qualified a
# cross-platform CLI and its release channels; this one checks what the fork
# ships: the published crates build, lint clean and pass their tests on Linux,
# package for crates.io, and follow the release rules in tools/release-plan.sh.
# The rest of the workspace — the unpublished `rmux` CLI the SDK's tests
# drive — is still compiled.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs this first: publishing cannot be undone, so it
  # must not depend on a separate CI run having passed.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # As in cctop: a warning is a failure, here as on the maintainer's machine.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - run: cargo fmt --all --check
      # Clippy holds the published crates, tests included, to the pinned
      # toolchain's lints. The rest of the workspace, the `rmux` CLI cctop does
      # not ship, has to compile without a warning.
      - name: Clippy the published crates
        run: |
          mapfile -t crates < <(cargo metadata --format-version 1 --no-deps --locked |
            jq -r '.packages[] | select(.publish != []) | .name')
          cargo clippy --locked --all-targets "${crates[@]/#/-p=}"
      - run: cargo check --locked --workspace

  # The published crates' own tests. The SDK's integration tests drive a real
  # daemon, which they build from the workspace's `rmux` binary; each test
  # starts it on a socket under its own temporary directory.
  test:
    runs-on: ubuntu-24.04
    env:
      # The server's command queue has large futures in a debug build, and its
      # tests run them on the test harness's threads: at the default 2 MiB some
      # overflow. Upstream's gates set the same 8 MiB, which is also the
      # daemon's own worker stack (src/server_runtime.rs).
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Test the published crates
        run: |
          mapfile -t crates < <(cargo metadata --format-version 1 --no-deps --locked |
            jq -r '.packages[] | select(.publish != []) | .name')
          cargo test --locked "${crates[@]/#/-p=}"

  # Packages every published crate the way `cargo publish` would, building
  # each from its packaged source: a manifest or include list that would stop
  # a release is caught here, not at release time. Cargo packages them in
  # dependency order against a local copy of the ones crates.io does not have
  # yet.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - run: |
          mapfile -t crates < <(cargo metadata --format-version 1 --no-deps --locked |
            jq -r '.packages[] | select(.publish != []) | .name')
          cargo package --locked "${crates[@]/#/-p=}"

  # The release rules (tools/release-plan.sh): on a commit that moves the
  # release version, every published crate that changed since the last
  # `cctop-v*` tag is bumped, an unchanged one is not, and a crate whose API
  # broke takes a breaking bump. On any other commit it passes with a notice.
  # The full history, because it compares against a tag.
  release-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - run: rustup toolchain install
      - id: semver-checks
        run: echo "version=$(sed -n 's/^# cargo-semver-checks //p' rust-toolchain.toml)" >>"$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@${{ steps.semver-checks.outputs.version }}
      - run: tools/release-plan.sh check
